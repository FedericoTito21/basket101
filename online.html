<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('es-ES');
const RAYA = { nba:'nbaraya.html' };
let rsport = window.__SOLO_NBA ? 'nba' : 'futbol';
rsport = window.__SOLO_NBA ? 'nba' : (() => { try{ return localStorage.getItem('fc_sport') === 'nba' ? 'nba' : 'futbol'; }catch(e){ return 'futbol'; } })();
const DUEL_GAMES = { 
  nbastats:{ em:'📊', name:'StatsHunter', file:'statshunter.html' }, nbatrophy:{ em:'🏆', name:'TrophyHunter', file:'trophyhunter.html' }, nbamulti:{ em:'🎰', name:'MultiHunter NBA', file:'nbamulti.html' }, };
const STATUS = { toplay:'¡Te toca!', waiting:'Esperando', won:'Ganaste 🏆', lost:'Perdiste', tie:'Empate' };
let tab = new URLSearchParams(location.search).get('tab') || 'jugar';
if(!['jugar','resultados','amigos'].includes(tab)) tab = 'jugar';
let data = null, loadingP = null, lastUid;
const $ = id => document.getElementById(id);
const dateLabel = t => { if(!t) return ''; const d = new Date(t); return `${d.getDate()}/${d.getMonth()+1}/${String(d.getFullYear()).slice(2)}`; };

/* ---------- datos: salas de TresEnRaya online + duelos ---------- */
async function loadData(){
  const uid = HG.uid(), db = await HG.getDb();
  const out = { invites:[], ttt:[], duels:[] };
  if(!db) return out;
  const now = Date.now();
  try{
    const [inv, h, g] = await Promise.all([
      db.collection('ttt').where('to', '==', uid).where('status', '==', 'waiting').limit(10).get(),
      db.collection('ttt').where('host', '==', uid).limit(60).get(),
      db.collection('ttt').where('guest', '==', uid).limit(60).get() ]);
    inv.forEach(d => { const x = d.data(); if(now - (x.ping || 0) < 60000) out.invites.push({ id:d.id, name:x.hostName, sport:x.sport || 'futbol' }); });
    const seen = new Set();
    [h, g].forEach(snap => snap.forEach(d => {
      const x = d.data(); if(seen.has(d.id) || !x.guest) return; seen.add(d.id);
      const mine = x.host === uid ? 'X' : 'O', other = mine === 'X' ? 'O' : 'X';
      const played = x.status === 'over' ? x.round : (x.round || 1) - 1;
      if(played <= 0) return;
      const my = (x.score && x.score[mine]) || 0, their = (x.score && x.score[other]) || 0;
      out.ttt.push({ id:d.id, rivalUid: mine === 'X' ? x.guest : x.host, rival: mine === 'X' ? x.guestName : x.hostName,
        my, their, draws: Math.max(0, played - my - their), played, t: x.turnAt || x.createdAt || 0, sport: x.sport || 'futbol' });
    }));
    out.invites = out.invites.filter(x => x.sport === 'nba'); out.ttt = out.ttt.filter(x => x.sport === 'nba');   // Basket101: solo salas de la NBA
  }catch(e){ console.warn('[online] salas', e); }
  try{ out.duels = (await HG.duel.list(60)) || []; }catch(e){}
  return out;
}
function ensureData(force){
  if(force || !loadingP) loadingP = loadData().then(d => { data = d; return d; });
  return loadingP;
}

/* ---------- comparación por rival ---------- */
function byRival(){
  const uid = HG.uid(), map = {};
  const get = (key, name) => (map[key] = map[key] || { key, name, w:0, l:0, d:0, tttW:0, tttL:0, tttD:0, dW:0, dL:0, dD:0, list:[] });
  data.ttt.forEach(m => {
    const r = get(m.rivalUid, m.rival);
    r.w += m.my; r.l += m.their; r.d += m.draws; r.tttW += m.my; r.tttL += m.their; r.tttD += m.draws;
    r.list.push({ t:m.t, kind:'ttt', txt:`⭕ TresEnRaya${m.sport === 'nba' ? ' NBA' : ''} · ${m.played} ${m.played === 1 ? 'partida' : 'partidas'}${m.draws ? ` (${m.draws} empate${m.draws > 1 ? 's' : ''})` : ''}`, res: m.my > m.their ? 'w' : m.my < m.their ? 'l' : 'd', score:`${m.my} – ${m.their}` });
  });
  data.duels.forEach(x => {
    const me = x.res.find(r => r.uid === uid);
    if(!me) return;
    x.res.filter(r => r.uid !== uid).forEach(o => {
      const r = get(o.uid, o.name), g = DUEL_GAMES[x.game] || { em:'⚔️', name:x.game };
      const res = me.score > o.score ? 'w' : me.score < o.score ? 'l' : 'd';
      if(res === 'w'){ r.w++; r.dW++; } else if(res === 'l'){ r.l++; r.dL++; } else { r.d++; r.dD++; }
      r.list.push({ t:x.t, kind:'duel', txt:`⚔️ Duelo · ${g.em} ${g.name}`, res, score:`${fmt(me.score)} – ${fmt(o.score)}` });
    });
  });
  return Object.values(map).map(r => (r.list.sort((a,b) => b.t - a.t), r)).sort((a,b) => (b.w+b.l+b.d) - (a.w+a.l+a.d));
}

/* ---------- vistas ---------- */
function loginView(){
  $('view').innerHTML = `<div class="login"><p>Entra con Google para jugar en directo, retar a tus amigos y comparar tus resultados con ellos.</p>
    <button class="hg-gbtn" type="button" id="loginBtn">${HG.googleLogo} Entrar con Google</button></div>`;
  $('loginBtn').onclick = () => HG.signIn();
}
function pendingList(){
  const inv = data.invites.map(x => `<a class="item st-toplay" href="${RAYA.nba}?sala=${x.id}"><span class="e">${x.sport === 'nba' ? '🏀' : '⭕'}</span><span class="t"><b>${esc(x.name)} te reta</b><small>TresEnRaya${x.sport === 'nba' ? ' NBA' : ''} en directo · te está esperando</small></span><span class="s">¡Únete!</span></a>`);
  const du = data.duels.filter(x => x.status === 'toplay').map(x => { const g = DUEL_GAMES[x.game];
    return `<a class="item st-toplay" href="${x.link}"><span class="e">${g.em}</span><span class="t"><b>Duelo de ${esc(x.rival)}</b><small>${g.name} · mismos jugadores que tu rival</small></span><span class="s">¡Te toca!</span></a>`; });
  return inv.concat(du);
}
function jugarView(){
  const friends = HG.friends.list();
  const pend = pendingList();
  const recent = data.duels.filter(x => x.status !== 'toplay').slice(0, 6).map(x => { const g = DUEL_GAMES[x.game];
    const sc = x.res.map(r => `${r.uid === HG.uid() ? 'Tú' : esc(r.name)} ${fmt(r.score)}`).join(' · ');
    return `<a class="item st-${x.status}" href="${x.link}"><span class="e">${g.em}</span><span class="t"><b>vs ${esc(x.rival)}</b><small>${g.name} · ${sc}</small></span><span class="s">${STATUS[x.status]}</span></a>`; });
  $('view').innerHTML = `
    ${pend.length ? `<div class="sec">📬 Pendientes</div>${pend.join('')}` : ''}
    <div class="sec">⭕ TresEnRaya en directo</div>
    
    <a class="big pri" href="${RAYA[rsport]}?online=quick"><span class="i">⚡</span><span>Buscar rival<small>Te emparejamos con quien esté buscando partida</small></span></a>
    <a class="big" href="${RAYA[rsport]}?online=link"><span class="i">🔗</span><span>Crear partida y enviar enlace<small>Para jugar con quien tú quieras</small></span></a>
    ${friends.length ? `<p class="note">Retar a un amigo:</p><div class="chips" style="margin-bottom:8px;">${friends.map(f => `<a href="${RAYA[rsport]}?online=friend&to=${encodeURIComponent(f.uid)}&toName=${encodeURIComponent(f.alias)}">👤 ${esc(f.alias)}</a>`).join('')}</div>` : ''}
    <div class="code"><input id="code" maxlength="5" placeholder="Código" aria-label="Código de partida" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="join">Unirme</button></div>
    <div class="sec">⚔️ Duelos</div>
    <p class="note">Juega una partida y, al terminar, pulsa «⚔️ Retar a un amigo»: tu rival jugará con los mismos jugadores y en el mismo orden.</p>
    
    <div class="games3" style="margin-top:6px;"><a href="statshunter.html"><span>📊</span>StatsHunter</a><a href="trophyhunter.html"><span>🏀</span>TrophyHunter</a><a href="nbamulti.html"><span>🎰</span>Multi NBA</a></div>
    ${recent.length ? `<div class="sec">Últimos duelos</div>${recent.join('')}` : ''}`;
  const go = () => { const c = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if(c.length !== 5){ HG.toast('El código tiene 5 letras o números.'); return; } location.href = RAYA[rsport] + '?sala=' + c; };
  $('join').onclick = go; $('code').onkeydown = e => { if(e.key === 'Enter') go(); };
  document.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => { rsport = b.dataset.rs; try{ localStorage.setItem('fc_sport', rsport); }catch(e){} jugarView(); });
}
function rivalCard(r){
  const tot = r.w + r.l + r.d || 1;
  const initials = String(r.name || '?').trim().split(/\s+/).map(x => x[0]).slice(0,2).join('').toUpperCase();
  const parts = [];
  if(r.tttW + r.tttL + r.tttD) parts.push(`⭕ ${r.tttW}-${r.tttL}${r.tttD ? ` (${r.tttD}E)` : ''}`);
  if(r.dW + r.dL + r.dD) parts.push(`⚔️ ${r.dW}-${r.dL}${r.dD ? ` (${r.dD}E)` : ''}`);
  return `<div class="rv">
    <button class="rv-h" aria-expanded="false"><span class="av">${esc(initials)}</span>
      <span class="t"><b>${esc(r.name)}</b><small>${parts.join(' · ')}${r.d ? ` · ${r.d} empate${r.d > 1 ? 's' : ''}` : ''}</small></span>
      <span class="sc"><span class="w">${r.w}</span> – <span class="l">${r.l}</span></span></button>
    <div class="bar" aria-hidden="true"><i class="w" style="width:${r.w/tot*100}%"></i><i class="d" style="width:${r.d/tot*100}%"></i><i class="l" style="width:${r.l/tot*100}%"></i></div>
    <div class="rv-list">${r.list.map(m => `<div class="m"><span>${m.txt}<small>${dateLabel(m.t)}</small></span><span class="r ${m.res}">${m.res === 'w' ? '✅' : m.res === 'l' ? '❌' : '🤝'} ${m.score}</span></div>`).join('')}</div>
  </div>`;
}
function resultadosView(){
  const T = data.ttt.reduce((a, m) => (a.w += m.my, a.l += m.their, a.d += m.draws, a), { w:0, l:0, d:0 });
  const uid = HG.uid();
  const D = data.duels.reduce((a, x) => { if(x.status === 'won') a.w++; else if(x.status === 'lost') a.l++; else if(x.status === 'tie') a.d++; return a; }, { w:0, l:0, d:0 });
  const rivals = byRival();
  $('view').innerHTML = `
    <div class="sum">
      <div class="tile"><div class="h">⭕ TresEnRaya en directo</div><div class="v"><span class="w">${T.w}</span> · <span class="d">${T.d}</span> · <span class="l">${T.l}</span></div><small>Ganadas · Empates · Perdidas</small></div>
      <div class="tile"><div class="h">⚔️ Duelos</div><div class="v"><span class="w">${D.w}</span> · <span class="d">${D.d}</span> · <span class="l">${D.l}</span></div><small>Ganados · Empates · Perdidos</small></div>
    </div>
    <div class="sec">Cara a cara</div>
    ${rivals.length ? rivals.map(rivalCard).join('') : `<div class="empty">Todavía no has jugado contra nadie. ¡Busca rival o reta a un amigo!</div>`}
    <p class="note" style="margin-top:10px;">Toca un rival para ver todas vuestras partidas. Los empates no suman a nadie.</p>`;
  document.querySelectorAll('.rv-h').forEach(b => b.onclick = () => { const c = b.parentElement; c.classList.toggle('open'); b.setAttribute('aria-expanded', c.classList.contains('open')); });
}
function amigosView(){
  const list = HG.friends.list();
  const rv = {}; byRival().forEach(r => rv[r.key] = r);
  $('view').innerHTML = `
    <div class="add"><input id="fname" maxlength="20" placeholder="Nombre de ranking exacto" aria-label="Nombre de tu amigo"><button id="fadd">Añadir</button></div>
    ${list.length ? list.map(f => { const r = rv[f.uid];
      return `<div class="fr"><span class="t"><b>${esc(f.alias)}</b><small>${r ? `Tú ${r.w} – ${r.l} ${esc(f.alias)}${r.d ? ` · ${r.d} empates` : ''}` : 'Todavía no habéis jugado'}</small></span>
        <a href="${RAYA[rsport]}?online=friend&to=${encodeURIComponent(f.uid)}&toName=${encodeURIComponent(f.alias)}">${rsport === 'nba' ? '🏀' : '⭕'} Retar</a>
        <button data-rm="${esc(f.uid)}" aria-label="Quitar a ${esc(f.alias)}">✕</button></div>`; }).join('')
      : `<div class="empty">Añade a tus amigos con su nombre de ranking para retarles y ver vuestros resultados.</div>`}
    <p class="note" style="margin-top:10px;">Solo puedes añadir a alguien que ya haya jugado con sesión iniciada. Tu nombre de ranking lo cambias en tu cuenta (arriba a la derecha).</p>`;
  const add = async () => { const v = $('fname').value.trim(); if(!v) return; await HG.friends.add(v); render(); };
  $('fadd').onclick = add; $('fname').onkeydown = e => { if(e.key === 'Enter') add(); };
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { await HG.friends.remove(b.dataset.rm); render(); });
}

async function render(){
  document.querySelectorAll('.tabs button').forEach(b => { b.classList.toggle('active', b.dataset.t === tab); b.setAttribute('aria-selected', b.dataset.t === tab); });
  history.replaceState(null, '', '?tab=' + tab);
  const st = HG.state();
  if(!st.configured){ $('view').innerHTML = `<div class="empty">El modo online estará disponible cuando la app esté conectada al servidor.</div>`; return; }
  if(!st.ready){ $('view').innerHTML = `<div class="loading">Cargando…</div>`; return; }
  if(!st.user){ loginView(); return; }
  if(!data) $('view').innerHTML = `<div class="loading">Cargando…</div>`;
  await ensureData();
  const n = pendingList().length;
  $('pendDot').hidden = !n; $('pendDot').textContent = n;
  if(tab === 'jugar') jugarView(); else if(tab === 'resultados') resultadosView(); else amigosView();
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.t; render(); }));
document.addEventListener('DOMContentLoaded', () => {
  if(!window.HG){ $('view').innerHTML = `<div class="empty">No se pudo cargar. Revisa tu conexión.</div>`; return; }
  HG.onChange(st => {
    const uid = st.user ? st.user.uid : null;
    if(uid !== lastUid){ lastUid = uid; data = null; loadingP = null; render(); }
    else if(!st.ready || !data) render();
  });
});
try{ if(localStorage.getItem('fc_sport') === 'nba') document.getElementById('backLink').href = 'index.html'; }catch(e){}
</script>
<script src="hunter-account.js" defer></script>
</body>
</html>
